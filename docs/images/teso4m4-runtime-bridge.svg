<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">How teso4m4 hijacks ESO's embedded MoltenVK at runtime</title>
  <desc id="desc">The installer preserves the pristine Bink library and places a proxy in ESO's existing Bink loader slot. When ESO starts, the proxy constructor verifies the exact executable, loads official MoltenVK 1.4.2, and writes 12-byte jumps into private in-memory copies of 17 old Vulkan wrapper entries. ESO's Vulkan calls then jump to compatibility shims and MoltenVK 1.4.2 before continuing through the same Metal path that already existed. The ESO executable on disk and embedded MoltenVK 1.0.18 remain unchanged. Process exit discards the memory patches, and restore puts the pristine Bink library back.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101c2d"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#153b57"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="newRuntime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#103a32"/>
      <stop offset="1" stop-color="#0d2f2a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6 0 12z" fill="#54e1b5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6 0 12z" fill="#62a9ff"/>
    </marker>
    <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6 0 12z" fill="#6e7f92"/>
    </marker>
  </defs>

  <rect width="1600" height="980" rx="30" fill="url(#background)"/>
  <circle cx="1475" cy="55" r="235" fill="#14385a" opacity=".22"/>
  <circle cx="70" cy="925" r="255" fill="#0f705b" opacity=".13"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="70" y="70" fill="#f5f9ff" font-size="37" font-weight="700">How teso4m4 hijacks ESO's embedded MoltenVK</text>
    <text x="70" y="108" fill="#a8b9cc" font-size="20">It does not create a new Metal connection. It reroutes ESO's existing Vulkan entry points before 1.0.18 can run.</text>

    <text x="70" y="165" fill="#7f96af" font-size="16" font-weight="700" letter-spacing="2">1  REVERSIBLE LOADER SETUP</text>
    <text x="520" y="165" fill="#7f96af" font-size="16" font-weight="700" letter-spacing="2">2  PER-PROCESS MEMORY HIJACK</text>
    <text x="1030" y="165" fill="#7f96af" font-size="16" font-weight="700" letter-spacing="2">3  SAME METAL PATH, NEW RUNTIME</text>

    <g filter="url(#shadow)">
      <rect x="70" y="195" width="400" height="570" rx="24" fill="#111f31" stroke="#38516d" stroke-width="2"/>
      <text x="100" y="238" fill="#f5f9ff" font-size="24" font-weight="700">Inside eso.app</text>
      <text x="100" y="266" fill="#93a8bf" font-size="16">The game expects one existing Bink filename.</text>

      <rect x="100" y="296" width="340" height="104" rx="16" fill="#17283d" stroke="#62a9ff" stroke-width="2"/>
      <text x="124" y="330" fill="#f5f9ff" font-size="19" font-weight="700">ESO executable</text>
      <text x="124" y="358" fill="#b4c4d6" font-size="16">imports libBink2Macx64.dylib</text>
      <text x="124" y="382" fill="#62a9ff" font-size="15" font-weight="700">ON DISK: BYTE-FOR-BYTE UNCHANGED</text>

      <path d="M270 400v35" stroke="#62a9ff" stroke-width="4" marker-end="url(#arrowBlue)"/>

      <rect x="100" y="446" width="340" height="112" rx="16" fill="#14364a" stroke="#54e1b5" stroke-width="2"/>
      <text x="124" y="482" fill="#f0fff9" font-size="20" font-weight="700">Bink loader slot → proxy</text>
      <text x="124" y="510" fill="#add8ce" font-size="16">same expected filename</text>
      <text x="124" y="536" fill="#add8ce" font-size="16">re-exports every original Bink symbol</text>

      <rect x="100" y="592" width="160" height="116" rx="16" fill="#172535" stroke="#647890" stroke-width="1.5"/>
      <text x="119" y="624" fill="#d9e3ef" font-size="17" font-weight="700">Pristine Bink</text>
      <text x="119" y="651" fill="#93a8bf" font-size="14">preserved copy</text>
      <text x="119" y="677" fill="#54e1b5" font-size="14" font-weight="700">RESTORE SOURCE</text>

      <rect x="280" y="592" width="160" height="116" rx="16" fill="#12382f" stroke="#54e1b5" stroke-width="1.5"/>
      <text x="299" y="624" fill="#effff9" font-size="17" font-weight="700">MoltenVK 1.4.2</text>
      <text x="299" y="651" fill="#add8ce" font-size="14">sidecar dylib</text>
      <text x="299" y="677" fill="#54e1b5" font-size="14" font-weight="700">PINNED + VERIFIED</text>

      <path d="M180 592v-25h80" fill="none" stroke="#6e7f92" stroke-width="3" marker-end="url(#arrowMuted)"/>
      <path d="M360 592v-25h-80" fill="none" stroke="#54e1b5" stroke-width="3" marker-end="url(#arrowGreen)"/>
      <text x="100" y="742" fill="#93a8bf" font-size="14">Only the loader slot is switched; the original is kept.</text>
    </g>

    <path d="M470 505h36" stroke="#54e1b5" stroke-width="5" marker-end="url(#arrowGreen)"/>

    <g filter="url(#shadow)">
      <rect x="520" y="195" width="470" height="570" rx="24" fill="url(#memory)" stroke="#3f8aba" stroke-width="2"/>
      <rect x="548" y="222" width="414" height="64" rx="15" fill="#0e253a" stroke="#58a6d8" stroke-width="1.5"/>
      <text x="574" y="250" fill="#f5f9ff" font-size="20" font-weight="700">dyld loads the proxy constructor</text>
      <text x="574" y="273" fill="#a7bdd2" font-size="14">before ESO's normal startup</text>

      <circle cx="574" cy="334" r="16" fill="#54e1b5"/>
      <text x="574" y="340" fill="#08241c" font-size="16" font-weight="700" text-anchor="middle">1</text>
      <text x="608" y="330" fill="#eef8ff" font-size="19" font-weight="700">Verify everything first</text>
      <text x="608" y="354" fill="#a7bdd2" font-size="15">SHA-256, UUID, 17 original byte sequences, destinations</text>

      <circle cx="574" cy="410" r="16" fill="#54e1b5"/>
      <text x="574" y="416" fill="#08241c" font-size="16" font-weight="700" text-anchor="middle">2</text>
      <text x="608" y="406" fill="#eef8ff" font-size="19" font-weight="700">dlopen MoltenVK 1.4.2</text>
      <text x="608" y="430" fill="#a7bdd2" font-size="15">resolve new runtime exports and compatibility shims</text>

      <circle cx="574" cy="486" r="16" fill="#54e1b5"/>
      <text x="574" y="492" fill="#08241c" font-size="16" font-weight="700" text-anchor="middle">3</text>
      <text x="608" y="482" fill="#eef8ff" font-size="19" font-weight="700">Create private code-page copies</text>
      <text x="608" y="506" fill="#a7bdd2" font-size="15">Private page copy; disk executable unchanged</text>

      <rect x="548" y="540" width="414" height="116" rx="16" fill="#101a29" stroke="#f0b35a" stroke-width="2"/>
      <text x="574" y="572" fill="#fff2da" font-size="19" font-weight="700">Write one 12-byte jump at each old entry</text>
      <text x="574" y="602" fill="#ffd18b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">movabs rax, destination</text>
      <text x="574" y="626" fill="#ffd18b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">jmp    rax</text>
      <text x="574" y="648" fill="#a7bdd2" font-size="14">clear instruction cache → restore page permissions to RX</text>

      <rect x="548" y="684" width="414" height="52" rx="13" fill="#0d3029" stroke="#54e1b5" stroke-width="1.5"/>
      <text x="755" y="716" fill="#effff9" font-size="17" font-weight="700" text-anchor="middle">17 verified entry addresses now jump away</text>
    </g>

    <path d="M990 505h26" stroke="#54e1b5" stroke-width="5" marker-end="url(#arrowGreen)"/>

    <g filter="url(#shadow)">
      <rect x="1030" y="195" width="500" height="570" rx="24" fill="#111f31" stroke="#38516d" stroke-width="2"/>
      <text x="1060" y="235" fill="#f5f9ff" font-size="22" font-weight="700">Each ESO Vulkan call</text>

      <rect x="1060" y="262" width="440" height="68" rx="14" fill="#17283d" stroke="#62a9ff" stroke-width="2"/>
      <text x="1280" y="293" fill="#f5f9ff" font-size="18" font-weight="700" text-anchor="middle">calls the same old wrapper address</text>
      <text x="1280" y="317" fill="#9fb1c5" font-size="14" text-anchor="middle">ESO call sites do not need to be rewritten</text>

      <path d="M1280 330v35" stroke="#f0b35a" stroke-width="4" marker-end="url(#arrowGreen)"/>

      <rect x="1060" y="374" width="440" height="76" rx="14" fill="#3a2b17" stroke="#f0b35a" stroke-width="2"/>
      <text x="1280" y="404" fill="#fff2da" font-size="19" font-weight="700" text-anchor="middle">in-memory 12-byte jump</text>
      <text x="1280" y="430" fill="#ffd18b" font-size="14" text-anchor="middle">the hijack point at MoltenVK 1.0.18's entry</text>

      <path d="M1280 450v34" stroke="#54e1b5" stroke-width="4" marker-end="url(#arrowGreen)"/>

      <rect x="1060" y="493" width="440" height="82" rx="14" fill="url(#newRuntime)" stroke="#54e1b5" stroke-width="2"/>
      <text x="1280" y="525" fill="#effff9" font-size="19" font-weight="700" text-anchor="middle">ESO compatibility shim → MoltenVK 1.4.2</text>
      <text x="1280" y="552" fill="#add8ce" font-size="14" text-anchor="middle">or direct 1.4.2 export when no shim is needed</text>

      <path d="M1280 575v28" stroke="#54e1b5" stroke-width="4" marker-end="url(#arrowGreen)"/>

      <rect x="1060" y="612" width="205" height="72" rx="14" fill="#17283d" stroke="#62a9ff" stroke-width="2"/>
      <text x="1162" y="643" fill="#f5f9ff" font-size="19" font-weight="700" text-anchor="middle">Apple Metal</text>
      <text x="1162" y="666" fill="#9fb1c5" font-size="14" text-anchor="middle">already existed</text>
      <path d="M1265 648h28" stroke="#54e1b5" stroke-width="4" marker-end="url(#arrowGreen)"/>
      <rect x="1305" y="612" width="195" height="72" rx="14" fill="#211b3e" stroke="#a58cff" stroke-width="2"/>
      <text x="1402" y="643" fill="#f7f3ff" font-size="19" font-weight="700" text-anchor="middle">Apple GPU</text>
      <text x="1402" y="666" fill="#bdb0e4" font-size="14" text-anchor="middle">same destination</text>

      <path d="M1060 412h-25v303h52" fill="none" stroke="#6e7f92" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrowMuted)"/>
      <rect x="1088" y="700" width="412" height="42" rx="12" fill="#1a2230" stroke="#6e7f92" stroke-width="1.5" stroke-dasharray="7 7"/>
      <text x="1294" y="726" fill="#8d99a8" font-size="15" font-weight="700" text-anchor="middle">Embedded 1.0.18 body remains on disk — bypassed</text>
      <path d="M1454 706l30 30M1484 706l-30 30" stroke="#ef7181" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="70" y="810" width="1460" height="116" rx="22" fill="#0c2b26" stroke="#54e1b5" stroke-width="2"/>
      <text x="100" y="848" fill="#effff9" font-size="21" font-weight="700">Nothing permanent is written into ESO's executable</text>
      <text x="100" y="879" fill="#acd5cc" font-size="16">QUIT: private memory pages and all 17 jumps disappear with the process.</text>
      <text x="100" y="906" fill="#acd5cc" font-size="16">RESTORE: the verified pristine Bink copy returns to its original loader slot; caches are preserved or restored by policy.</text>

      <rect x="1090" y="836" width="400" height="64" rx="15" fill="#102019" stroke="#54e1b5" stroke-width="1.5"/>
      <circle cx="1122" cy="868" r="15" fill="#54e1b5"/>
      <path d="M1115 868l5 5 10-12" fill="none" stroke="#08241c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1150" y="862" fill="#effff9" font-size="17" font-weight="700">Same ESO SHA-256 before and after</text>
      <text x="1150" y="885" fill="#acd5cc" font-size="14">reversible loader swap + ephemeral memory patch</text>
    </g>

    <circle cx="85" cy="953" r="6" fill="#54e1b5"/>
    <text x="102" y="959" fill="#a8b9cc" font-size="14">Green: active 1.4.2 route</text>
    <line x1="330" y1="953" x2="372" y2="953" stroke="#6e7f92" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="388" y="959" fill="#a8b9cc" font-size="14">Dashed: original 1.0.18 route left present but unused</text>
    <text x="1515" y="959" fill="#7f96af" font-size="14" text-anchor="end">Exact-build, fail-closed</text>
  </g>
</svg>

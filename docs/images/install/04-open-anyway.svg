<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Open Anyway in Privacy and Security</title><desc id="desc">An illustrated macOS Privacy and Security settings panel highlights the Open Anyway button.</desc>
  <rect width="1200" height="620" fill="#eceff3"/><rect x="80" y="55" width="1040" height="510" rx="22" fill="#fff" stroke="#b9c0c9" stroke-width="3"/>
  <text x="130" y="125" fill="#17191c" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="700">Privacy &amp; Security</text>
  <line x1="130" y1="160" x2="1070" y2="160" stroke="#d1d5db" stroke-width="2"/>
  <text x="130" y="225" fill="#17191c" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="27" font-weight="600">Security</text>
  <rect x="125" y="260" width="950" height="175" rx="14" fill="#f5f6f8"/>
  <text x="165" y="315" fill="#333840" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22">“Install.command” was blocked because it is not from an</text><text x="165" y="347" fill="#333840" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22">identified developer.</text>
  <rect x="795" y="365" width="235" height="52" rx="10" fill="#1677ff"/><text x="912" y="399" text-anchor="middle" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="22" font-weight="700">Open Anyway</text>
  <path d="M700 490 L900 425" fill="none" stroke="#1677ff" stroke-width="6" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1677ff"/></marker></defs>
  <text x="130" y="525" fill="#5b6470" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="19">Illustrated example; wording and layout vary by macOS version.</text>
</svg>
